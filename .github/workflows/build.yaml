name: Build Spark Jar

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # Build custom dev image from Dockerfile
      # ----------------------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build -t scala-spark-dev .

      # ----------------------------------------------------------------------
      # Compile inside container
      # ----------------------------------------------------------------------

      - name: Build assembly jar
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            scala-spark-dev \
            sbt clean assembly

      # ------------------------------------------------------------
      # 3. Compute next version tag (AUTO INCREMENT)
      # ------------------------------------------------------------
      - name: Generate next version tag
        id: version
        run: |
          # Get latest tag (if exists)
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          echo "Latest tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            # remove "v"
            VERSION=${LATEST_TAG#v}

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # increment PATCH version
            PATCH=$((PATCH + 1))

            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          fi

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # 4. Create and push tag
      # ------------------------------------------------------------
      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "Creating tag $NEW_TAG"

          git tag $NEW_TAG
          git push origin $NEW_TAG
      
      # ----------------------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------------------

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: spark-assembly-jar
          path: target/scala-2.12/*assembly.jar